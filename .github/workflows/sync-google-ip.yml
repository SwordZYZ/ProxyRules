name: Sync Google IP rules

on:
  schedule:
    - cron: '17 1 * * 1' # Monday 09:17 Asia/Shanghai
  workflow_dispatch:

concurrency:
  group: sync-google-ip

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref }}

      - name: Generate GoogleIP.list
        run: python3 ProxyConfig/Clash/rule/update_google_ip.py

      - name: Commit changed rules
        shell: bash
        run: |
          git add -- ProxyConfig/Clash/rule/GoogleIP.list
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: sync Google IP rules'
          git push origin "HEAD:${GITHUB_REF}"
